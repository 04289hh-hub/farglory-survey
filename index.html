<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>遠雄悅來 - 端午供貨調查</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #003366; --accent: #d4af37; --success: #2e7d32; --danger: #c62828; --bg: #f8fafc; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); margin: 0; padding: 0; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 500px; background: #ffffff; min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.1); position: relative; padding-bottom: 100px; }
        .app-header { background: linear-gradient(135deg, var(--primary), #001f42); color: white; padding: 25px 20px; text-align: center; border-bottom: 4px solid var(--accent); }
        .app-header h1 { margin: 0; font-size: 24px; letter-spacing: 1px; }
        .app-header p { margin: 5px 0 0 0; font-size: 14px; opacity: 0.8; }
        .notice-card { background: #fff9e6; border-left: 5px solid var(--accent); padding: 15px; margin: 15px; border-radius: 4px; font-size: 15px; line-height: 1.5; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .form-group { padding: 0 15px; margin-bottom: 20px; }
        .form-group label { display: block; font-weight: bold; font-size: 18px; margin-bottom: 8px; color: var(--primary); }
        .form-group label span { color: var(--danger); margin-left: 4px; }
        .input-control { width: 100%; padding: 14px; font-size: 18px; border: 2px solid #cbd5e1; border-radius: 8px; outline: none; }
        .section-title { font-size: 18px; font-weight: bold; color: var(--primary); margin: 20px 0 10px 15px; border-bottom: 2px solid #e2e8f0; padding-bottom: 5px; }
        .date-row { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; margin: 0 15px 12px 15px; }
        .date-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .date-text { font-size: 20px; font-weight: bold; color: #1e293b; }
        .date-tag { background: #ffedd5; color: #ea580c; padding: 4px 8px; border-radius: 6px; font-size: 13px; font-weight: bold; }
        .option-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .opt-btn { background: #f8fafc; border: 2px solid #cbd5e1; border-radius: 8px; padding: 10px 2px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 75px; }
        .opt-btn .symbol { font-size: 22px; font-weight: bold; }
        .opt-btn .opt-name { font-size: 11px; font-weight: bold; line-height: 1.2; }
        .opt-btn[data-val="O"].active { background: #e8f5e9; border-color: var(--success); color: var(--success); }
        .opt-btn[data-val="X"].active { background: #ffebee; border-color: var(--danger); color: var(--danger); }
        .opt-btn[data-val="£"].active { background: #fff8e1; border-color: #f57f17; color: #f57f17; }
        .opt-btn[data-val="P"].active { background: #fff8e1; border-color: #e65100; color: #e65100; }
        .bottom-bar { position: fixed; bottom: 0; width: 100%; max-width: 500px; background: #ffffff; padding: 15px; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); border-top: 1px solid #e2e8f0; z-index: 100; }
        .submit-btn { width: 100%; background: var(--success); color: white; border: none; padding: 16px; font-size: 20px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        .submit-btn:disabled { background: #94a3b8; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 200; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: white; width: 100%; max-width: 400px; border-radius: 16px; padding: 25px; text-align: center; }
        .summary-box { background: #f1f5f9; padding: 15px; border-radius: 8px; text-align: left; margin: 15px 0; font-size: 14px; max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
    </style>
</head>
